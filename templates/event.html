<article class="event-entry" id="$id" aria-labelledby="$id-title">
  <div class="event-meta"><span class="event-status">$status</span>$date</div>
  <h3 id="$id-title">$title</h3>
  <p class="event-lead">$summary</p>
  $facts
  <div class="event-body">$body</div>
  $photos $links
  <p class="event-source note">$published_label $published_date</p>
</article>
