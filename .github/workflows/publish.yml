name: Publish website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # A changed draft requires a fresh review; never retain an older pending release.
  cancel-in-progress: true

jobs:
  build:
    name: Validate and prepare review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test content generation
        run: python3 -m unittest discover -s tests -v
      - name: Build Romanian and English pages
        run: python3 scripts/build.py
      - name: Check generated links and accessibility markup
        run: python3 scripts/check_site.py
      - name: Prepare administrator review
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/review.py
      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Publish after administrator approval
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      # Required reviewer is enforced in GitHub Settings > Environments, not CMS fields.
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Refuse a superseded release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/review.py --check-current
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
